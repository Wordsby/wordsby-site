# Site settings: production URL, menus, and form service connection.

site:
  url: https://www.example.org # production URL, used for canonical links and the sitemap
  language: en

navigation:
  header:
    - label: About
      href: /about/
    - label: Classes
      href: /classes/
    - label: Contact
      href: /contact/
  cta:
    label: Try a free class
    href: /contact/
  footer:
    - label: Privacy
      href: /privacy/

forms:
  # The shared form service. http://localhost:8787 is the local dev server
  # (see services/forms in the platform repo). Replace with the deployed URL.
  endpoint: http://localhost:8787
  site_id: riverside-arts
  # turnstile_site_key: "" # add to turn on Cloudflare Turnstile spam protection
